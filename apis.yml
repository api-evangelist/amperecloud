aid: amperecloud
name: Amperecloud
description: >-
  Amperecloud (Amperecloud GmbH) is a German renewable-energy management
  software company whose cloud platform provides an operating system for
  monitoring, operating, and commercially managing solar, wind, and other
  renewable-energy assets at scale. The platform brings asset performance
  monitoring, maintenance and ticket management, commercial and technical asset
  management, and virtual power plant (VPP) capabilities into a single system,
  supported by migration, consulting, and custom-integration services. It is
  used by more than 300 customers worldwide managing over 8,000 installations
  and 10+ GWp of capacity. Added to the API Evangelist network as a point-nine
  portfolio company; no public developer API, OpenAPI, or developer portal is
  currently published, so this profile captures verified company identity and a
  domain-security probe pending any future public API surface.
